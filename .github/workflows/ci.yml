name: CI — CQT Light

on:
  push:
    branches: [dev, main, "copilot/**"]
  pull_request:
    branches: [dev, main]

jobs:
  # ─────────────────────────────────────────────
  # Backend — Python / FastAPI / pytest
  # ─────────────────────────────────────────────
  backend:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependências
        working-directory: backend
        run: pip install -r requirements.txt pytest-cov

      - name: Executar testes com cobertura
        working-directory: backend
        run: |
          python -m pytest tests/ \
            --cov=. \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-fail-under=80 \
            -q

      - name: Upload cobertura (Codecov)
        if: always()
        uses: codecov/codecov-action@v4
        with:
          file: backend/coverage.xml
          flags: backend
          fail_ci_if_error: false

  # ─────────────────────────────────────────────
  # Frontend — Node / Vitest
  # ─────────────────────────────────────────────
  frontend:
    name: Frontend Tests (Node)
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Configurar Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependências
        working-directory: frontend
        run: npm ci

      - name: Executar testes com cobertura
        working-directory: frontend
        run: npm run test:coverage

  # ─────────────────────────────────────────────
  # Docker — Build de imagens
  # ─────────────────────────────────────────────
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Build imagem backend
        run: docker build -t cqt-backend:ci ./backend

      - name: Build imagem frontend
        run: docker build -t cqt-frontend:ci ./frontend
