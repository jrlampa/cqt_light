version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "5174:5174"
    environment:
      - NODE_ENV=development
      - VITE_PORT=5174
    networks:
      - cqt-network

  backend-etl:
    build:
      context: .
      dockerfile: Dockerfile-python
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./frontend:/app/frontend
    networks:
      - cqt-network

networks:
  cqt-network:
    driver: bridge
