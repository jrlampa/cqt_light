version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      target: frontend-dev
    volumes:
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    ports:
      - "${VITE_PORT:-5174}:5174"
    environment:
      - NODE_ENV=development
      - VITE_PORT=${VITE_PORT:-5174}
    networks:
      - cqt-network
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:5174" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  backend-etl:
    build:
      context: .
      dockerfile: Dockerfile-python
    volumes:
      - ./scripts:/app/scripts
      - ./data:/app/data
      - ./frontend:/app/frontend
    networks:
      - cqt-network
    environment:
      - NODE_ENV=development
    healthcheck:
      test: [ "CMD", "python3", "scripts/check_deps.py" ]
      interval: 1m
      timeout: 10s
      retries: 3

networks:
  cqt-network:
    driver: bridge
